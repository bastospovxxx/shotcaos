<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHOT CAOS</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0a14;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
#gamewrap,#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
.scr{position:fixed;inset:0;background:#0a0a14ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;overflow:auto;z-index:10}
h1{font-size:clamp(2rem,8vw,4rem);color:#ff3d6e;letter-spacing:4px;margin:0 0 10px}
button,input,select{padding:12px 18px;border-radius:8px;border:1px solid #444;background:#1b1b2e;color:#fff;font-size:1rem;min-width:240px}
button{cursor:pointer;background:#ff3d6e;border:0;font-weight:700}button:hover{filter:brightness(1.15)}
label{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:280px}
label input,label select{min-width:0}
#sList{width:min(520px,100%)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#1b1b2e;padding:10px;border-radius:8px;margin:6px 0}
.row button{min-width:0;padding:8px 14px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;font-weight:700;text-shadow:0 0 4px #000}
#bars{position:absolute;left:12px;top:10px}#hPow{position:absolute;left:12px;bottom:12px;display:flex;gap:8px}
.pw{background:#000a;border:1px solid #fff5;padding:6px 10px;border-radius:6px;font-size:.8rem}
#hEv{position:absolute;right:12px;top:10px;color:#ffd24d}#hPl{position:absolute;right:12px;bottom:12px;font-size:.8rem}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff}
#bPause{position:absolute;right:12px;top:40px;pointer-events:auto;min-width:0;padding:6px 10px}
#banner{position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:20;font-size:1.6rem;font-weight:800;color:#ffd24d;text-align:center;text-shadow:0 0 8px #000}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:8px;z-index:30}
@media(max-width:600px){button,input{min-width:200px}}

</style></head>
<body>
<div id="gamewrap"><canvas id="cv"></canvas></div>
<div id="hud" class="hide">
 <div id="bars">HP <b id="hHp"></b> | 🛡 <b id="hSh"></b> | LV <b id="hLv"></b> | XP <b id="hXp"></b> | ☠ <b id="hK"></b></div>
 <div id="hPow"></div><div id="hEv"></div><div id="hPl"></div><div id="cross">+</div>
 <button id="bPause">☰</button>
</div>
<div id="banner" class="hide"></div><div id="toast" class="hide"></div>

<section id="auth" class="scr hide"><h1>SHOT CAOS</h1>
 <input id="aEmail" type="email" placeholder="E-mail"><input id="aPass" type="password" placeholder="Senha (mín. 6)">
 <input id="aName" placeholder="Nome de usuário (para criar conta)">
 <button id="bLogin">ENTRAR</button><button id="bReg">CRIAR CONTA</button>
 <button id="bForgot">ESQUECI A SENHA</button><button id="bOff0">MODO OFFLINE</button></section>

<section id="menu" class="scr hide"><h1>SHOT CAOS</h1>
 <button id="bOn">JOGAR ONLINE</button><button id="bOff">JOGAR OFFLINE</button>
 <button id="bSrv">SERVIDORES</button><button id="bProf">PERFIL</button>
 <button id="bCfg">CONFIGURAÇÕES</button><button id="bCred">CRÉDITOS</button>
 <button id="bOut">SAIR DA CONTA</button></section>

<section id="servers" class="scr hide"><h2>SERVIDORES</h2>
 <input id="sName" placeholder="Nome do novo servidor"><button id="bCreate">CRIAR SERVIDOR</button>
 <button id="bRefresh">ATUALIZAR LISTA</button><div id="sList"></div><button class="back">VOLTAR</button></section>

<section id="lobby" class="scr hide"><h2>SHOT CAOS — LOBBY</h2><div id="lTitle"></div>
 <div id="lPlayers"></div><div id="lCount"></div>
 <button id="bStart" class="hide">INICIAR PARTIDA</button><div id="lWait" class="hide">Aguardando o dono...</div>
 <button id="bLeave">SAIR DO SERVIDOR</button></section>

<section id="prof" class="scr hide"><h2>PERFIL</h2><pre id="pInfo"></pre><button class="back">VOLTAR</button></section>

<section id="cfg" class="scr hide"><h2>CONFIGURAÇÕES</h2>
 <label>Sensibilidade <input id="cSens" type="range" min="1" max="10" step=".5"></label>
 <label>FOV <input id="cFov" type="range" min="60" max="110"></label>
 <label>Volume <input id="cVol" type="range" min="0" max="1" step=".1"></label>
 <label>Qualidade <select id="cQ"><option value="1">Alta</option><option value=".6">Média</option><option value=".4">Baixa</option></select></label>
 <label><input id="cRed" type="checkbox"> Reduzir efeitos visuais</label>
 <label><input id="cFx" type="checkbox"> Efeitos visuais ligados</label>
 <label><input id="cFps" type="checkbox"> Mostrar FPS</label>
 <button id="bSaveCfg">SALVAR</button></section>

<section id="cred" class="scr hide"><h2>CRÉDITOS</h2><p>SHOT CAOS — Three.js + Firebase.</p><button class="back">VOLTAR</button></section>
<section id="pause" class="scr hide"><h2>PAUSA</h2><button id="bResume">CONTINUAR</button><button id="bQuit">SAIR PARA O MENU</button></section>
<section id="end" class="scr hide"><h2 id="endT"></h2><button id="bEnd">VOLTAR AO MENU</button></section>
<section id="err" class="scr hide"><h2>Algo deu errado</h2><p id="errT"></p><button onclick="location.reload()">RECARREGAR</button></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
// SHOT CAOS — auth, servidores, progresso por servidor, FPS, combate, poderes, eventos, efeitos.
const cfg = {
  apiKey: "AIzaSyD9BSLyo_yUsFFxMydfrioB9CS6z30aax0", authDomain: "shotcaos-99d4f.firebaseapp.com",
  projectId: "shotcaos-99d4f", messagingSenderId: "1061680701683", appId: "1:1061680701683:web:a885e84f7205a059709786"
}; // storageBucket/analytics não são usados de propósito.
const V = "10.12.2", G0 = "https://www.gstatic.com/firebasejs/" + V + "/";
const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll(".scr").forEach(e => e.classList.add("hide")); if (id) $(id).classList.remove("hide"); };
let tt; const toast = (t, ms = 3500) => { const e = $("toast"); e.textContent = t; e.classList.remove("hide"); clearTimeout(tt); tt = setTimeout(() => e.classList.add("hide"), ms); };
const banner = (t, ms = 3000) => { const e = $("banner"); e.innerHTML = t; e.classList.remove("hide"); setTimeout(() => e.classList.add("hide"), ms); };
window.addEventListener("error", e => { console.error(e.error || e.message); });
window.addEventListener("unhandledrejection", e => console.error(e.reason));
const AUTH_ERR = { "auth/wrong-password": "Senha incorreta.", "auth/invalid-credential": "E-mail ou senha incorretos.", "auth/invalid-email": "E-mail inválido.", "auth/user-not-found": "Usuário inexistente.", "auth/email-already-in-use": "Este e-mail já está em uso.", "auth/weak-password": "Senha fraca (mínimo 6 caracteres).", "auth/network-request-failed": "Erro de conexão." };
const friendly = e => AUTH_ERR[e.code] || (e.code === "permission-denied" ? "Sem permissão para esta ação." : "Ocorreu um erro. Tente novamente.");

// ---------- Configurações / save local ----------
const defCfg = { sens: 3, fov: 80, vol: .5, q: 1, red: false, fx: true, fps: false };
let C = { ...defCfg, ...JSON.parse(localStorage.getItem("sc_cfg") || "{}") };
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.error(e); } };

// ---------- Firebase (com fallback offline) ----------
let FB, auth, db, user = null;
try {
  const [a, au, fs] = await Promise.all([import(G0 + "firebase-app.js"), import(G0 + "firebase-auth.js"), import(G0 + "firebase-firestore.js")]);
  FB = { ...au, ...fs, initializeApp: a.initializeApp };
  const app = FB.initializeApp(cfg); auth = FB.getAuth(app); db = FB.getFirestore(app);
  FB.onAuthStateChanged(auth, async u => { user = u; if (u) { try { await FB.setDoc(FB.doc(db, "users", u.uid), { uid: u.uid, email: u.email, username: u.displayName || u.email.split("@")[0], lastLogin: FB.serverTimestamp() }, { merge: true }); } catch (e) { console.error(e); } show("menu"); } else show("auth"); });
} catch (e) { console.error(e); toast("Firebase indisponível — entrando no modo offline."); FB = null; show("menu"); }
const online = () => !!(FB && user);

$("bLogin").onclick = async () => { try { await FB.signInWithEmailAndPassword(auth, $("aEmail").value.trim(), $("aPass").value); } catch (e) { console.error(e); toast(friendly(e)); } };
$("bReg").onclick = async () => {
  try { const r = await FB.createUserWithEmailAndPassword(auth, $("aEmail").value.trim(), $("aPass").value); const n = $("aName").value.trim() || $("aEmail").value.split("@")[0];
    await FB.updateProfile(r.user, { displayName: n });
    await FB.setDoc(FB.doc(db, "users", r.user.uid), { uid: r.user.uid, username: n, email: r.user.email, createdAt: FB.serverTimestamp(), lastLogin: FB.serverTimestamp(), globalStats: { matches: 0, wins: 0, kills: 0, maxLevel: 1 } }, { merge: true });
  } catch (e) { console.error(e); toast(friendly(e)); } };
$("bForgot").onclick = async () => { try { await FB.sendPasswordResetEmail(auth, $("aEmail").value.trim()); toast("E-mail de recuperação enviado."); } catch (e) { toast(friendly(e)); } };
$("bOut").onclick = async () => { if (FB) await FB.signOut(auth); else show("menu"); };
$("bOff0").onclick = $("bOff").onclick = () => startGame({ offline: true, seed: lsGet("sc_off")?.seed || (Math.random() * 1e9 | 0) });
$("bOn").onclick = $("bSrv").onclick = () => { if (!online()) return toast("Faça login para jogar online."), show("auth"); show("servers"); listServers(); };
document.querySelectorAll(".back").forEach(b => b.onclick = () => show("menu"));
$("bCred").onclick = () => show("cred");
$("bProf").onclick = async () => {
  const off = lsGet("sc_off") || {}; let g = { matches: 0, wins: 0, kills: 0, maxLevel: 1 };
  if (online()) { try { const s = await FB.getDoc(FB.doc(db, "users", user.uid)); g = { ...g, ...(s.data()?.globalStats || {}) }; } catch (e) { console.error(e); } }
  $("pInfo").textContent = `Nome: ${user?.displayName || "Offline"}\nNível offline: ${off.level || 1}  XP: ${off.xp || 0}\nPartidas: ${g.matches}  Vitórias: ${g.wins}\nInimigos derrotados: ${g.kills + (off.kills || 0)}\nPoderes descobertos: ${(off.powers || []).length}\nMaior nível: ${Math.max(g.maxLevel, off.level || 1)}`; show("prof"); };
$("bCfg").onclick = () => { $("cSens").value = C.sens; $("cFov").value = C.fov; $("cVol").value = C.vol; $("cQ").value = C.q; $("cRed").checked = C.red; $("cFx").checked = C.fx; $("cFps").checked = C.fps; show("cfg"); };
$("bSaveCfg").onclick = () => { C = { sens: +$("cSens").value, fov: +$("cFov").value, vol: +$("cVol").value, q: +$("cQ").value, red: $("cRed").checked, fx: $("cFx").checked, fps: $("cFps").checked }; lsSet("sc_cfg", C); toast("Configurações salvas."); show("menu"); };

// ---------- Servidores ----------
let curSrv = null, unsubs = [];
const sref = id => FB.doc(db, "servers", id);
async function listServers() {
  const box = $("sList"); box.textContent = "Carregando...";
  try { const snap = await FB.getDocs(FB.query(FB.collection(db, "servers"), FB.where("status", "in", ["waiting", "playing"]), FB.limit(30)));
    box.innerHTML = ""; let n = 0;
    snap.forEach(d => { const s = d.data(); const ms = s.lastActivity?.toMillis?.() || Date.now(); if (Date.now() - ms > 6 * 3600e3) return; n++;
      const c = s.playerIds.length, r = document.createElement("div"); r.className = "row";
      r.innerHTML = `<span>${s.name.replace(/[<>&]/g, "")} — ${c}/5 (${5 - c} livres) — ${s.status} — Nível ${s.currentLevel}</span>`;
      const b = document.createElement("button"); b.textContent = s.playerIds.includes(user.uid) ? "VOLTAR" : c >= 5 ? "CHEIO" : "ENTRAR"; b.disabled = c >= 5 && !s.playerIds.includes(user.uid);
      b.onclick = () => joinServer(d.id); r.appendChild(b); box.appendChild(r); });
    if (!n) box.textContent = "Nenhum servidor. Crie o primeiro!";
  } catch (e) { console.error(e); box.textContent = "Não foi possível listar os servidores."; } }
$("bRefresh").onclick = listServers;
$("bCreate").onclick = async () => {
  const name = ($("sName").value.trim() || "Servidor de " + (user.displayName || "Jogador")).slice(0, 30);
  try { const r = FB.doc(FB.collection(db, "servers")); const seed = Math.random() * 1e9 | 0;
    await FB.setDoc(r, { serverId: r.id, name, ownerId: user.uid, createdAt: FB.serverTimestamp(), lastActivity: FB.serverTimestamp(), maxPlayers: 5, status: "waiting", seed, currentLevel: 1, activeEvent: null, gameState: "lobby", playerIds: [user.uid] });
    await FB.setDoc(FB.doc(db, "servers", r.id, "players", user.uid), { uid: user.uid, name: user.displayName || "Jogador", joinedAt: FB.serverTimestamp() });
    openLobby(r.id); } catch (e) { console.error(e); toast(friendly(e)); } };
async function joinServer(id) {
  try { const s = await FB.getDoc(sref(id)); if (!s.exists()) return toast("Servidor não existe mais.");
    const d = s.data(), has = d.playerIds.includes(user.uid);
    if (!has) { if (d.playerIds.length >= 5) return toast("Servidor cheio (5/5)."); if (d.status === "finished") return toast("Partida encerrada.");
      await FB.updateDoc(sref(id), { playerIds: FB.arrayUnion(user.uid), lastActivity: FB.serverTimestamp() });
      await FB.setDoc(FB.doc(db, "servers", id, "players", user.uid), { uid: user.uid, name: user.displayName || "Jogador", joinedAt: FB.serverTimestamp() }); }
    openLobby(id); } catch (e) { console.error(e); toast(friendly(e) + " (pode estar cheio)"); } }
function openLobby(id) {
  unsubs.forEach(u => u()); unsubs = []; curSrv = id; show("lobby"); let players = [], srv = null, started = false;
  const render = () => { if (!srv) return; $("lTitle").textContent = "Servidor: " + srv.name; const el = $("lPlayers"); el.innerHTML = "";
    for (let i = 0; i < 5; i++) { const p = players[i]; el.innerHTML += `<div>${p ? "🟢 " + p.name.replace(/[<>&]/g, "") + (p.uid === srv.ownerId ? " 👑" : "") : "⚪ Vazio"}</div>`; }
    $("lCount").textContent = srv.playerIds.length + "/5";
    const own = srv.ownerId === user.uid; $("bStart").classList.toggle("hide", !own || srv.status !== "waiting"); $("lWait").classList.toggle("hide", own || srv.status !== "waiting");
    if (srv.status === "playing" && !started && srv.playerIds.includes(user.uid)) { started = true; unsubs.forEach(u => u()); unsubs = []; startGame({ offline: false, seed: srv.seed, serverId: id, srv }); } };
  unsubs.push(FB.onSnapshot(sref(id), s => { if (!s.exists()) { toast("Servidor encerrado."); show("servers"); listServers(); return; } srv = s.data(); render(); }, e => { console.error(e); toast("Reconectando..."); }));
  unsubs.push(FB.onSnapshot(FB.collection(db, "servers", id, "players"), s => { players = s.docs.map(d => d.data()); render(); }));
}
$("bStart").onclick = async () => { try { await FB.updateDoc(sref(curSrv), { status: "playing", gameState: "running", lastActivity: FB.serverTimestamp() }); } catch (e) { toast(friendly(e)); } };
$("bLeave").onclick = leaveServer;
async function leaveServer() {
  unsubs.forEach(u => u()); unsubs = []; const id = curSrv; curSrv = null;
  try { if (id) { const s = await FB.getDoc(sref(id)); await FB.deleteDoc(FB.doc(db, "servers", id, "players", user.uid));
    if (s.exists()) { const left = s.data().playerIds.filter(x => x !== user.uid);
      if (!left.length && s.data().ownerId === user.uid) await FB.deleteDoc(sref(id)); else await FB.updateDoc(sref(id), { playerIds: FB.arrayRemove(user.uid), lastActivity: FB.serverTimestamp() }); } } } catch (e) { console.error(e); }
  show("servers"); listServers(); }

// ---------- Progresso (por servidor / offline) ----------
const xpNeed = l => Math.round(40 * Math.pow(l, 1.35));
let P = null, ctx = null; // P = progresso, ctx = { offline, serverId }
const freshP = () => ({ level: 1, xp: 0, powers: ["dash", "shockwave", "heal"], kills: 0, effects: [], resources: 0, hp: 100, lastSave: 0 });
async function loadProgress() {
  if (ctx.offline) return { ...freshP(), ...(lsGet("sc_off") || {}) };
  try { const s = await FB.getDoc(FB.doc(db, "users", user.uid, "serverProgress", ctx.serverId)); if (s.exists()) return { ...freshP(), ...s.data() }; } catch (e) { console.error(e); const l = lsGet("sc_p_" + ctx.serverId); if (l) return l; }
  return freshP(); }
async function saveProgress() {
  if (!P) return; P.lastSave = Date.now(); const d = { level: P.level, xp: P.xp, powers: P.powers, kills: P.kills, effects: [], resources: P.resources, currentRunData: { hp: Math.round(P.hp) }, lastSave: FB && !ctx.offline ? FB.serverTimestamp() : Date.now() };
  if (ctx.offline) return lsSet("sc_off", { ...P, seed: ctx.seed });
  lsSet("sc_p_" + ctx.serverId, P); // cópia local caso a conexão caia
  try { await FB.setDoc(FB.doc(db, "users", user.uid, "serverProgress", ctx.serverId), d, { merge: true }); } catch (e) { console.error(e); } }
addEventListener("offline", () => toast("Reconectando...", 6000));
addEventListener("online", () => { toast("Conexão restaurada."); saveProgress(); });

// ---------- Utilidades ----------
const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
let actx; const beep = (f, d = .1, t = "square") => { if (C.vol <= 0) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.type = t; o.frequency.value = f; g.gain.value = C.vol * .15; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d); o.stop(actx.currentTime + d); } catch { } };

// ---------- Poderes (cooldown, duração, raridade, efeito real) ----------
const R = ["Common", "Uncommon", "Rare", "Epic", "Legendary", "Mythic"];
const POWERS = {
  dash: { n: "Dash", cd: 4, r: 0, d: "Avança rápido", f: g => { g.vel.x = -Math.sin(g.yaw) * 30; g.vel.z = -Math.cos(g.yaw) * 30; g.dashT = .2; } },
  shockwave: { n: "Shockwave", cd: 6, r: 0, d: "Dano em área curta", f: g => aoe(g, 7, 40 + P.level * 3) },
  heal: { n: "Heal", cd: 12, r: 0, d: "Cura 40 HP", f: g => { P.hp = Math.min(g.maxHp, P.hp + 40); } },
  freeze: { n: "Freeze", cd: 14, r: 1, d: "Congela inimigos 4s", f: g => { g.freeze = 4; } },
  shield: { n: "Time Shield", cd: 15, r: 1, d: "+50 escudo", f: g => { g.sh = Math.min(100, g.sh + 50); } },
  speed: { n: "Speed Boost", cd: 14, r: 1, d: "+50% velocidade 8s", f: g => { g.buff.speed = 8; } },
  dmg: { n: "Damage Boost", cd: 16, r: 2, d: "+80% dano 8s", f: g => { g.buff.dmg = 8; } },
  vamp: { n: "Vampirism", cd: 18, r: 2, d: "Rouba vida 8s", f: g => { g.buff.vamp = 8; } },
  nova: { n: "Nova", cd: 14, r: 3, d: "Explosão grande", f: g => aoe(g, 14, 90 + P.level * 5) },
  meteor: { n: "Meteor", cd: 20, r: 4, d: "Meteoros em 6 inimigos", f: g => { g.enemies.slice(0, 6).forEach(e => hit(g, e, 200 + P.level * 8)); fx("flash", 0.4); } },
  chaos: { n: "Chaos Pulse", cd: 30, r: 5, d: "Dano massivo + efeito caos", f: g => { aoe(g, 30, 400 + P.level * 10); fx("caos", 4); } }
};
const POWER_ORDER = Object.keys(POWERS);
function aoe(g, rad, dmg) { g.enemies.slice().forEach(e => { if (e.m.position.distanceTo(g.cam.position) < rad) hit(g, e, dmg); }); fx("flash", .3); }

// ---------- Efeitos visuais (CSS filter/transform, desligáveis) ----------
const EFFECTS = { pb: "grayscale(1)", blur: "blur(3px)", cores: "hue-rotate(140deg)", inverter: "invert(1)", brilho: "brightness(1.8)", escuro: "brightness(.4)", sat: "saturate(3)", flash: "brightness(3)", caos: "hue-rotate(90deg) saturate(2) contrast(1.4)", espelho: "", };
let fxList = [];
function fx(name, dur) { if (!C.fx || C.red && !["flash"].includes(name)) return; fxList.push({ name, t: dur }); }
function applyFx(dt) { fxList = fxList.filter(e => (e.t -= dt) > 0); const cv = $("cv"); cv.style.filter = fxList.map(e => EFFECTS[e.name]).join(" "); cv.style.transform = fxList.some(e => e.name === "espelho") ? "scaleX(-1)" : ""; }

// ---------- Eventos ----------
const EVENTS = [
  { n: "CHUVA DE METEOROS", m: "Evite as áreas marcadas!", d: 12, s: g => { g.evT = 0; }, u: (g, dt) => { g.evT -= dt; if (g.evT <= 0) { g.evT = 1; const e = g.enemies[0]; if (e) hit(g, e, 120); fx("flash", .15); if (!C.red) g.shake = .3; } } },
  { n: "XP DOBRADO", m: "Todo XP x2!", d: 30, s: g => { g.xpMul = 2; }, e: g => { g.xpMul = 1; } },
  { n: "NÉVOA", m: "Visão reduzida", d: 25, s: g => { g.scene.fog.density = .09; fx("escuro", 25); }, e: g => { g.scene.fog.density = .02; } },
  { n: "GRAVIDADE BAIXA", m: "Pule mais alto!", d: 25, s: g => { g.grav = 8; }, e: g => { g.grav = 24; } },
  { n: "CURA GLOBAL", m: "HP restaurado", d: 1, s: g => { P.hp = g.maxHp; } },
  { n: "ENXAME", m: "Muitos inimigos!", d: 20, s: g => { for (let i = 0; i < 12; i++) spawn(g, "fast"); } },
  { n: "INIMIGOS LENTOS", m: "Aproveite!", d: 20, s: g => { g.slow = .5; }, e: g => { g.slow = 1; } },
  { n: "CAOS TOTAL", m: "Tudo ao mesmo tempo!", d: 15, s: g => { g.xpMul = 3; fx("caos", 15); fx("espelho", 6); }, e: g => { g.xpMul = 1; } }
];

// ---------- Jogo ----------
let g = null;
const TYPES = { normal: { hp: 40, sp: 3, dmg: 8, xp: 10, c: 0xcc3333, s: 1 }, fast: { hp: 25, sp: 5.5, dmg: 6, xp: 12, c: 0xffaa00, s: .8 }, tank: { hp: 140, sp: 2, dmg: 18, xp: 30, c: 0x3366cc, s: 1.5 }, boss: { hp: 1500, sp: 2.6, dmg: 30, xp: 400, c: 0xaa00ff, s: 3.2 } };
const CELL = 4, N = 25;

async function startGame(o) {
  try {
    ctx = o; P = await loadProgress(); if (o.offline) { ctx.seed = o.seed; }
    stopGame(); const T = window.THREE; if (!T) throw new Error("Three.js não carregou");
    const rand = rng(o.seed), scene = new T.Scene(); scene.background = new T.Color(0x0a0a18); scene.fog = new T.FogExp2(0x0a0a18, .02);
    const cam = new T.PerspectiveCamera(C.fov, innerWidth / innerHeight, .1, 200);
    const rd = new T.WebGLRenderer({ canvas: $("cv"), antialias: C.q >= 1 }); rd.setPixelRatio(Math.min(devicePixelRatio, 2) * C.q); rd.setSize(innerWidth, innerHeight, false);
    scene.add(new T.AmbientLight(0xffffff, .7)); const dl = new T.DirectionalLight(0xffffff, .6); dl.position.set(10, 30, 10); scene.add(dl);
    const floor = new T.Mesh(new T.PlaneGeometry(N * CELL, N * CELL), new T.MeshLambertMaterial({ color: 0x222233 })); floor.rotation.x = -Math.PI / 2; floor.position.set(N * CELL / 2, 0, N * CELL / 2); scene.add(floor);
    // Mapa procedural: bordas, salas abertas, corredores e obstáculos
    const grid = []; for (let y = 0; y < N; y++) { grid[y] = []; for (let x = 0; x < N; x++) grid[y][x] = (x === 0 || y === 0 || x === N - 1 || y === N - 1) ? 1 : (rand() < .2 ? 1 : 0); }
    for (let i = 0; i < 6; i++) { const rx = 2 + (rand() * (N - 9) | 0), ry = 2 + (rand() * (N - 9) | 0), w = 3 + (rand() * 4 | 0), h = 3 + (rand() * 4 | 0); for (let y = ry; y < ry + h; y++) for (let x = rx; x < rx + w; x++) grid[y][x] = 0; }
    for (let y = 10; y < 15; y++) for (let x = 10; x < 15; x++) grid[y][x] = 0;
    const walls = []; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (grid[y][x]) walls.push([x, y]);
    const im = new T.InstancedMesh(new T.BoxGeometry(CELL, 6, CELL), new T.MeshLambertMaterial({ color: 0x445577 }), walls.length), mt = new T.Matrix4();
    walls.forEach(([x, y], i) => { mt.setPosition(x * CELL + CELL / 2, 3, y * CELL + CELL / 2); im.setMatrixAt(i, mt); }); scene.add(im);
    g = { T, scene, cam, rd, rand, grid, enemies: [], vel: new T.Vector3(), yaw: 0, pitch: 0, vy: 0, onGround: true, keys: {}, cd: {}, buff: {}, freeze: 0, slow: 1, xpMul: 1, grav: 24, sh: 0, maxHp: 100, hpT: 0, shootT: 0, dashT: 0, shake: 0, ev: null, evAt: 25, evT: 0, clock: new T.Clock(), run: true, paused: false, boss: false, fpsN: 0, fpsT: 0 };
    g.maxHp = 100 + (P.level - 1) * 5; P.hp = Math.min(Math.max(P.hp || g.maxHp, 20), g.maxHp);
    cam.position.set(12 * CELL + 2, 1.6, 12 * CELL + 2);
    for (let i = 0; i < 8; i++) spawn(g, "normal");
    bindInput(); show(null); $("hud").classList.remove("hide"); rd.domElement.requestPointerLock?.();
    g.save = setInterval(saveProgress, 15000); beep(440, .2); banner("SHOT CAOS — sobreviva até o NÍVEL 50!");
    if (o.serverId) { const q = FB.collection(db, "servers", o.serverId, "players"); g.unsub = FB.onSnapshot(q, s => { g.pl = s.docs.map(d => d.data().name).join(", "); }); }
    g.raf = requestAnimationFrame(loop);
  } catch (e) { console.error(e); $("errT").textContent = "Não foi possível iniciar o jogo. Tente o modo offline ou recarregue."; show("err"); }
}
const solid = (g, x, z) => { const gx = Math.floor(x / CELL), gz = Math.floor(z / CELL); return !(g.grid[gz] && g.grid[gz][gx] === 0); };
function spawn(g, type) {
  const T = TYPES[type], sc = 1 + P.level * .08; let x, z, k = 0; do { x = 2 + g.rand() * (N - 4) * CELL; z = 2 + g.rand() * (N - 4) * CELL; k++; } while ((solid(g, x, z) || Math.hypot(x - g.cam.position.x, z - g.cam.position.z) < 18) && k < 60);
  if (k >= 60) return; const m = new g.T.Mesh(new g.T.BoxGeometry(T.s, T.s * 1.6, T.s), new g.T.MeshLambertMaterial({ color: T.c })); m.position.set(x, T.s * .8, z); g.scene.add(m);
  const e = { m, type, hp: T.hp * sc, max: T.hp * sc, sp: T.sp, dmg: T.dmg * sc, xp: T.xp, atk: 0, ph: 1 }; m.userData.e = e; g.enemies.push(e); }
function hit(g, e, d) { if (!e || e.dead) return; const crit = Math.random() < .1; d *= crit ? 2 : 1; e.hp -= d; e.m.material.emissive?.setHex(0xffffff); setTimeout(() => e.m.material.emissive?.setHex(0), 60);
  if (g.buff.vamp) P.hp = Math.min(g.maxHp, P.hp + d * .1); if (e.hp <= 0) kill(g, e); }
function kill(g, e) { e.dead = true; g.scene.remove(e.m); g.enemies = g.enemies.filter(x => x !== e); P.kills++; P.resources += 1; beep(200, .1, "sawtooth");
  P.xp += Math.round(e.xp * g.xpMul); if (e.type === "boss") { g.boss = false; banner("CHEFE DERROTADO!"); P.xp += 300; }
  while (P.level < 50 && P.xp >= xpNeed(P.level)) { P.xp -= xpNeed(P.level); P.level++; g.maxHp += 5; P.hp = g.maxHp; levelUp(g); }
  if (P.level >= 50) P.xp = 0;
  if (g.enemies.length < 6 + Math.min(P.level, 30)) spawn(g, P.level > 5 && g.rand() < .25 ? "tank" : g.rand() < .35 ? "fast" : "normal"); }
function levelUp(g) { beep(880, .3, "triangle"); const next = POWER_ORDER.find(p => !P.powers.includes(p)); let msg = "NÍVEL " + P.level + "!";
  if (P.level >= 50) { msg = "NÍVEL MÁXIMO"; win(); } else if (next && P.level % 3 === 0) { P.powers.push(next); msg += `<br>Novo poder: ${POWERS[next].n} [${R[POWERS[next].r]}] (tecla ${Math.min(P.powers.length, 5)})`; }
  banner(msg, 3500); saveProgress();
  if (P.level % 10 === 0 && !g.boss) { g.boss = true; spawn(g, "boss"); banner("⚠ CHEFE!<br>Fase 2 abaixo de 50% de vida", 4000); } }
async function win() { if (online() && ctx.serverId) { try { await FB.updateDoc(sref(ctx.serverId), { status: "finished", gameState: "finished" }); } catch { } } endGame("VITÓRIA! NÍVEL MÁXIMO"); }
function usePower(i) { if (!g || g.paused) return; const id = P.powers[i]; if (!id) return; const p = POWERS[id]; if ((g.cd[id] || 0) > 0) return; g.cd[id] = p.cd; p.f(g); beep(600 + i * 100, .2, "sine"); }
function shoot() { if (!g || g.shootT > 0) return; g.shootT = .2; beep(300, .05); const rc = new g.T.Raycaster(); rc.setFromCamera({ x: 0, y: 0 }, g.cam);
  const hits = rc.intersectObjects(g.enemies.map(e => e.m)); if (hits[0] && hits[0].distance < 60) hit(g, hits[0].object.userData.e, (20 + P.level * 2) * (g.buff.dmg ? 1.8 : 1)); }

function loop() {
  if (!g || !g.run) return; g.raf = requestAnimationFrame(loop); const dt = Math.min(g.clock.getDelta(), .05);
  if (!g.paused) update(dt); g.rd.render(g.scene, g.cam); }
function update(dt) {
  const k = g.keys, c = g.cam; let sp = 6 * (k.ShiftLeft ? 1.6 : 1) * (g.buff.speed ? 1.5 : 1), mx = 0, mz = 0;
  if (k.KeyW) mz -= 1; if (k.KeyS) mz += 1; if (k.KeyA) mx -= 1; if (k.KeyD) mx += 1;
  const sn = Math.sin(g.yaw), cs = Math.cos(g.yaw); let vx = (mx * cs + mz * sn) * sp, vz = (mz * cs - mx * sn) * sp;
  if (g.dashT > 0) { g.dashT -= dt; vx = g.vel.x; vz = g.vel.z; }
  const nx = c.position.x + vx * dt, nz = c.position.z + vz * dt, r = .4;
  if (!solid(g, nx + Math.sign(vx) * r, c.position.z)) c.position.x = nx; if (!solid(g, c.position.x, nz + Math.sign(vz) * r)) c.position.z = nz;
  if (k.Space && g.onGround) { g.vy = g.grav > 12 ? 9 : 14; g.onGround = false; } g.vy -= g.grav * dt; c.position.y += g.vy * dt; if (c.position.y <= 1.6) { c.position.y = 1.6; g.vy = 0; g.onGround = true; }
  c.rotation.set(g.pitch + (g.shake > 0 ? (Math.random() - .5) * g.shake * .1 : 0), g.yaw, 0, "YXZ"); g.shake = Math.max(0, g.shake - dt);
  g.shootT -= dt; if (g.mouse) shoot(); for (const id in g.cd) g.cd[id] = Math.max(0, g.cd[id] - dt); for (const b in g.buff) g.buff[b] = Math.max(0, g.buff[b] - dt);
  g.freeze = Math.max(0, g.freeze - dt); if (g.sh > 0) g.sh = Math.max(0, g.sh - dt * .3);
  for (const e of g.enemies) { const p = e.m.position, dx = c.position.x - p.x, dz = c.position.z - p.z, d = Math.hypot(dx, dz) || 1; if (e.type === "boss" && e.hp < e.max / 2 && e.ph === 1) { e.ph = 2; e.sp *= 1.6; banner("FASE 2!"); }
    if (!g.freeze) { const s = e.sp * g.slow * dt, ex = p.x + dx / d * s, ez = p.z + dz / d * s; if (!solid(g, ex, p.z)) p.x = ex; if (!solid(g, p.x, ez)) p.z = ez; }
    e.atk -= dt; if (d < 1.6 + e.m.scale.x && e.atk <= 0 && !g.freeze) { e.atk = 1; let dm = e.dmg; if (g.sh > 0) { const a = Math.min(g.sh, dm); g.sh -= a; dm -= a; } P.hp -= dm; fx("flash", .1); g.shake = .3; beep(120, .1); } }
  if (P.hp <= 0) return endGame("DERROTA");
  // Eventos
  g.evAt -= dt; if (g.ev) { g.evT -= dt; g.ev.u?.(g, dt); if (g.evT <= 0) { g.ev.e?.(g); g.ev = null; g.evAt = 40 + g.rand() * 30; } } else if (g.evAt <= 0) { const ev = EVENTS[g.rand() * EVENTS.length | 0]; g.ev = ev; g.evT = ev.d; ev.s(g); banner("⚠ " + ev.n + "<br><small>" + ev.m + "</small>", 3500); beep(150, .5, "sawtooth"); }
  applyFx(dt); hud();
}
function hud() { $("hHp").textContent = Math.ceil(P.hp) + "/" + g.maxHp; $("hSh").textContent = Math.ceil(g.sh); $("hLv").textContent = P.level >= 50 ? "NÍVEL MÁXIMO" : P.level; $("hXp").textContent = P.xp + "/" + xpNeed(P.level); $("hK").textContent = P.kills;
  $("hEv").textContent = g.ev ? `${g.ev.n} ${Math.ceil(g.evT)}s` : "Objetivo: nível 50"; $("hPl").textContent = ctx.offline ? "Offline" : "Jogadores: " + (g.pl || user.displayName);
  $("hPow").innerHTML = P.powers.slice(0, 5).map((id, i) => `<div class="pw">[${i + 1}] ${POWERS[id].n}${g.cd[id] > 0 ? " " + g.cd[id].toFixed(0) + "s" : " ✔"}</div>`).join("");
  if (C.fps) { g.fpsN++; g.fpsT += 1 / 60; } }
function bindInput() {
  const kd = e => { if (!g) return; g.keys[e.code] = true; if (e.code >= "Digit1" && e.code <= "Digit5") usePower(+e.code.slice(5) - 1); if (e.code === "KeyE") toast("Nada para interagir aqui."); };
  const ku = e => { if (g) g.keys[e.code] = false; };
  const mm = e => { if (g && document.pointerLockElement) { g.yaw -= e.movementX * .0004 * C.sens * 2; g.pitch = Math.max(-1.4, Math.min(1.4, g.pitch - e.movementY * .0004 * C.sens * 2)); } };
  const md = e => { if (!g) return; if (!document.pointerLockElement) { $("cv").requestPointerLock?.(); return; } g.mouse = true; }, mu = () => { if (g) g.mouse = false; };
  const pl = () => { if (g && !document.pointerLockElement && g.run && !g.over) pause(true); };
  const rs = () => { if (g) { g.rd.setSize(innerWidth, innerHeight, false); g.cam.aspect = innerWidth / innerHeight; g.cam.updateProjectionMatrix(); } };
  const L = [["keydown", kd], ["keyup", ku], ["mousemove", mm], ["mousedown", md], ["mouseup", mu], ["pointerlockchange", pl, document], ["resize", rs]];
  L.forEach(([n, f, t]) => (t || window).addEventListener(n, f)); g.off = () => L.forEach(([n, f, t]) => (t || window).removeEventListener(n, f)); }
function pause(on) { if (!g) return; g.paused = on; if (on) { saveProgress(); show("pause"); } else { show(null); $("cv").requestPointerLock?.(); } }
$("bResume").onclick = () => pause(false); $("bPause").onclick = () => { document.exitPointerLock?.(); pause(true); };
$("bQuit").onclick = async () => { const o = ctx; await saveProgress(); stopGame(); if (o && !o.offline) { curSrv = o.serverId; leaveServer(); } else show("menu"); };
async function endGame(t) { if (!g) return; g.over = true; document.exitPointerLock?.(); await saveProgress();
  if (online()) { try { const ref = FB.doc(db, "users", user.uid), s = await FB.getDoc(ref), gs = s.data()?.globalStats || { matches: 0, wins: 0, kills: 0, maxLevel: 1 };
    await FB.setDoc(ref, { globalStats: { matches: gs.matches + 1, wins: gs.wins + (t.startsWith("VIT") ? 1 : 0), kills: gs.kills + P.kills, maxLevel: Math.max(gs.maxLevel, P.level) } }, { merge: true }); } catch (e) { console.error(e); } }
  if (ctx.offline && t === "DERROTA") { P = { ...freshP(), level: Math.max(1, P.level - 1), powers: P.powers, kills: P.kills }; lsSet("sc_off", { ...P, seed: ctx.seed }); }
  stopGame(); $("endT").textContent = t; show("end"); beep(t === "DERROTA" ? 100 : 900, .6); }
$("bEnd").onclick = () => { if (online() && ctx && !ctx.offline) { curSrv = ctx.serverId; leaveServer(); } else show("menu"); };
function stopGame() { if (!g) return; g.run = false; cancelAnimationFrame(g.raf); clearInterval(g.save); g.off?.(); g.unsub?.(); g.rd.dispose(); $("cv").style.filter = ""; $("cv").style.transform = ""; $("hud").classList.add("hide"); document.exitPointerLock?.(); g = null; }
addEventListener("beforeunload", () => { if (g) saveProgress(); });
if (!FB) show("menu");

</script>
